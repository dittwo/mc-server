global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          instance: minecraft-vm

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: minecraft
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ["mc-monitor:8080"]
